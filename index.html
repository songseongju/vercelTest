<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STAR DASH · 별빛 질주</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#e9efff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}main{width:min(940px,96vw);padding:24px 0}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:24px;letter-spacing:4px;margin:0}small{color:#8495b5;letter-spacing:1px}.stats{display:flex;gap:24px;text-align:right}.stats b{display:block;font-size:24px;color:#79ffe1}.frame{position:relative;border:1px solid #293450;border-radius:22px;overflow:hidden;box-shadow:0 20px 100px #0008}canvas{display:block;width:100%;height:auto;touch-action:none;background:#0b1124}.cover{position:absolute;inset:0;display:grid;place-items:center;background:#080c198a;backdrop-filter:blur(5px);text-align:center;padding:20px}.cover.hidden{display:none}.card{max-width:440px}.tag{color:#79ffe1;font-size:12px;letter-spacing:4px}h2{font-size:clamp(30px,6vw,54px);margin:14px 0}p{line-height:1.8;color:#b3c2dc}button{border:0;border-radius:12px;padding:15px 28px;font:700 16px system-ui;cursor:pointer;background:#79ffe1;color:#061b20;box-shadow:0 0 30px #79ffe122}button:hover{background:#b2ffed}button:focus-visible{outline:3px solid white;outline-offset:4px}footer{display:flex;justify-content:space-between;gap:15px;margin-top:14px;color:#8495b5;font-size:13px}kbd{color:#d5dff3}.pause{padding:9px 12px;font-size:13px;background:#202d48;color:#d5dff3;box-shadow:none}@media(max-width:550px){h1{font-size:17px}.stats{gap:12px}.stats b{font-size:19px}footer{font-size:11px}header small{font-size:10px}}

/* Fit the playable field to the WebView, including notches and browser bars. */
html{height:100%;overscroll-behavior:none}body{height:100%;min-height:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}main{height:100%;height:100dvh;max-height:100%;display:flex;flex-direction:column;padding: max(10px,env(safe-area-inset-top)) max(0px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(0px,env(safe-area-inset-left))}.frame{flex:1;min-height:0}canvas{width:100%;height:100%}header{flex-shrink:0;margin-bottom:10px}.pause{min-width:44px;min-height:44px}button{touch-action:manipulation;min-height:48px}footer{flex-shrink:0;flex-wrap:wrap;margin-top:8px}.cover{overflow:auto;-webkit-backdrop-filter:blur(5px)}.mobile-help{display:none}@media(pointer:coarse){.desktop-help{display:none}.mobile-help{display:inline}}@media(max-height:450px){header{margin-bottom:4px}header small{display:none}h1{font-size:17px}.stats b{font-size:18px}footer{margin-top:4px}h2{font-size:26px;margin:6px 0}.card p{margin:6px 0;font-size:13px}.tag{display:none}.cover{padding:8px}}
canvas{cursor:grab}canvas.dragging{cursor:grabbing}</style>
<main><header><div><h1>STAR DASH</h1><small>별빛 질주 / v1.2 · DRAG</small></div><div class="stats"><div><small>SCORE</small><b id="score">0</b></div><div><small>BEST</small><b id="best">0</b></div><button class="pause" id="pause" aria-label="일시정지">Ⅱ</button></div></header>
<div class="frame"><canvas id="game" width="900" height="540" aria-label="방향키로 운석을 피하고 별을 모으는 게임"></canvas><div class="cover" id="cover"><div class="card"><div class="tag">A TINY SPACE ARCADE</div><h2 id="title">별을 향해, 질주.</h2><p id="message">다가오는 운석을 피하고 황금빛 별을 모으세요.<br>출발 후, 화면 아무 곳이나 누른 채 드래그하세요.<br>마우스와 손가락 모두 사용할 수 있어요.</p><button id="start">출발하기 →</button></div></div></div>
<footer><span class="mobile-help">화면 어디서든 드래그해서 이동 · Ⅱ 일시정지</span><span class="desktop-help">마우스를 누른 채 드래그 · <kbd>방향키 / WASD</kbd> 이동 · <kbd>P</kbd> 일시정지</span><span>별 +100</span></footer></main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),cover=document.getElementById('cover'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start');
let W=900,H=540;const keys=new Set();let state='ready',best=0,score=0,elapsed=0,spawn=0,starTimer=0,rocks=[],stars=[],particles=[],player={x:130,y:270},last=0,drag=false,target=null;
try{best=Number(localStorage.getItem('star-dash-best'))||0}catch{}bestEl.textContent=best;
const bg=Array.from({length:95},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,s:Math.random()*30+10}));
function resize(){const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const oldW=W,oldH=H;H=540;W=Math.max(300,540*rect.width/rect.height);player.x*=W/oldW;player.y*=H/oldH;for(const list of [rocks,stars,particles,bg])for(const item of list){item.x*=W/oldW;item.y*=H/oldH}const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);resetPointer()}
addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function begin(){state='playing';score=elapsed=spawn=0;starTimer=.5;rocks=[];stars=[];particles=[];player={x:130,y:270};keys.clear();resetPointer();cover.classList.add('hidden');scoreEl.textContent=0;last=performance.now()}
function pause(){if(state==='playing'){state='paused';keys.clear();resetPointer();title.textContent='잠깐, 숨 고르기.';message.textContent='준비되면 다시 우주로 출발하세요.';start.textContent='계속하기 →';cover.classList.remove('hidden')}else if(state==='paused'){state='playing';last=performance.now();cover.classList.add('hidden')}}
function finish(){state='over';const total=Math.floor(score),record=total>best;if(record){best=total;try{localStorage.setItem('star-dash-best',String(best))}catch{}}bestEl.textContent=best;title.textContent=record?'새로운 최고 기록!':'다시 한번, 더 멀리.';message.textContent=`${Math.floor(elapsed)}초 생존 · ${total}점. 다음 비행에서는 더 멀리 갈 수 있어요.`;start.textContent='다시 출발하기 ↻';cover.classList.remove('hidden');resetPointer()}
start.onclick=()=>state==='paused'?pause():begin();document.getElementById('pause').onclick=pause;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'){if(state==='ready'||state==='over')begin();else pause()}if(e.code==='KeyP'||e.code==='Escape')pause();keys.add(e.code)});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
let activePointer=null,anchor=null;
function resetPointer(){canvas.classList.remove('dragging');activePointer=null;anchor=null;drag=false;target=null}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pointerStart(e,id){if(state!=='playing'||activePointer!==null)return;activePointer=id;drag=true;canvas.classList.add('dragging');const p=point(e);anchor={x:p.x,y:p.y,px:player.x,py:player.y};target={x:player.x,y:player.y}}
function pointerMove(e,id){if(state!=='playing'||!drag||id!==activePointer)return;const p=point(e);target={x:Math.max(23,Math.min(W-23,anchor.px+p.x-anchor.x)),y:Math.max(23,Math.min(H-23,anchor.py+p.y-anchor.y))}}
if(window.PointerEvent){canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerStart(e,e.pointerId);if(activePointer===e.pointerId)canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>pointerMove(e,e.pointerId));for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{if(e.pointerId===activePointer)resetPointer()})}
else{canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t)pointerStart(t,t.identifier)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of Array.from(e.changedTouches))pointerMove(t,t.identifier)},{passive:false});for(const event of ['touchend','touchcancel'])canvas.addEventListener(event,e=>{for(const t of Array.from(e.changedTouches))if(t.identifier===activePointer)resetPointer()})}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
resize();
function burst(x,y){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=Math.random()*140+50;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6})}}
function update(dt){elapsed+=dt;score+=dt*10;const difficulty=Math.min(elapsed/45,2.4);let dx=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA')),dy=Number(keys.has('ArrowDown')||keys.has('KeyS'))-Number(keys.has('ArrowUp')||keys.has('KeyW'));if(dx||dy){const length=Math.hypot(dx,dy);player.x+=dx/length*330*dt;player.y+=dy/length*330*dt}else if(target){const x=target.x-player.x,y=target.y-player.y,d=Math.hypot(x,y),step=Math.min(d,430*dt);if(d){player.x+=x/d*step;player.y+=y/d*step}}
player.x=Math.max(23,Math.min(W-23,player.x));player.y=Math.max(23,Math.min(H-23,player.y));spawn-=dt;starTimer-=dt;
if(spawn<=0){const r=17+Math.random()*24;rocks.push({x:W+r,y:r+Math.random()*(H-r*2),r,v:190+difficulty*90+Math.random()*70,a:Math.random()*6,spin:Math.random()*2-1,shape:Array.from({length:9},()=>.8+Math.random()*.2)});spawn=.65/(1+difficulty*.6)}
if(starTimer<=0){stars.push({x:W+20,y:40+Math.random()*(H-80),a:0});starTimer=1.1+Math.random()*.7}
for(const r of rocks){r.x-=r.v*dt;r.a+=r.spin*dt;if(Math.hypot(player.x-r.x,player.y-r.y)<r.r*.82+12){finish();return}}
for(const s of stars){s.x-=(180+difficulty*55)*dt;s.a+=dt*3;if(!s.hit&&Math.hypot(player.x-s.x,player.y-s.y)<27){s.hit=true;score+=100;burst(s.x,s.y)}}rocks=rocks.filter(r=>r.x>-60);stars=stars.filter(s=>s.x>-30&&!s.hit);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);scoreEl.textContent=Math.floor(score)}
function draw(dt){ctx.clearRect(0,0,W,H);const glow=ctx.createRadialGradient(660,230,0,660,230,580);glow.addColorStop(0,'#172647');glow.addColorStop(1,'#080d1c');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(const s of bg){if(state==='playing'||state==='ready'){s.x-=s.s*dt;if(s.x<0)s.x=W}ctx.globalAlpha=.3+s.r/3;ctx.fillStyle='#becfff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
for(const s of stars){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.shadowColor='#ffdd70';ctx.shadowBlur=20;ctx.fillStyle='#ffe29a';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?6:14;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.fillStyle='#35415c';ctx.strokeStyle='#6c7b98';ctx.lineWidth=2;ctx.beginPath();r.shape.forEach((v,i)=>{const a=i/9*Math.PI*2;ctx.lineTo(Math.cos(a)*r.r*v,Math.sin(a)*r.r*v)});ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#232e46';ctx.beginPath();ctx.arc(-r.r*.22,-r.r*.12,r.r*.23,0,7);ctx.fill();ctx.restore()}
for(const p of particles){ctx.globalAlpha=p.life/.6;ctx.fillStyle='#ffe29a';ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#79ffe1';ctx.shadowBlur=20;ctx.fillStyle='#79ffe1';ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-15,-14);ctx.lineTo(-8,0);ctx.lineTo(-15,14);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f0ffff';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.fill();ctx.fillStyle='#85a8ff';ctx.beginPath();ctx.moveTo(-12,-5);ctx.lineTo(-28-Math.sin(performance.now()/70)*7,0);ctx.lineTo(-12,5);ctx.fill();ctx.restore();ctx.fillStyle='#637595';ctx.font='11px system-ui';ctx.fillText(`SECTOR ${String(1+Math.floor(elapsed/15)).padStart(2,'0')}`,22,H-20)}
function frame(now){const dt=Math.min((now-last)/1000||0,.035);last=now;if(state==='playing')update(dt);draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
