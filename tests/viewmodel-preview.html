<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAST FIELD · Viewmodel QA</title><style>body{margin:0;background:#182129;color:#e1e7e8;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}aside{position:absolute;top:24px;left:30px}h1{font-size:16px;letter-spacing:3px}button{background:#2d3c45;color:#eef2f4;border:1px solid #647a84;border-radius:4px;padding:10px;margin:4px;cursor:pointer}small{display:block;color:#aebdc3;margin:12px 4px}output{position:absolute;right:20px;bottom:20px}</style><canvas id="world"></canvas><aside><h1>LAST FIELD / MODEL REVIEW</h1><div id="weapons"></div><button id="aim">조준</button><button id="fire">사격</button><button id="reload">재장전</button><button id="inspect">측면 보기</button><small>게임과 동일한 손·무기 모델 / 조작·재질 시각 검증용</small></aside><output id="stats"></output><script src="vendor/babylon.js"></script><script src="environment.js"></script><script src="viewmodel.js"></script><script>
const B=BABYLON,canvas=document.getElementById('world'),engine=new B.Engine(canvas,true),scene=new B.Scene(engine),camera=new B.FreeCamera('review',new B.Vector3(0,0,0),scene);camera.minZ=.025;camera.fov=1.08;scene.clearColor=new B.Color4(.09,.12,.15,1);
const hemi=new B.HemisphericLight('fill',new B.Vector3(0,1,-1),scene);hemi.intensity=.55;const sun=new B.DirectionalLight('key',new B.Vector3(-.4,-1,.5),scene);sun.intensity=2;scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=B.ImageProcessingConfiguration.TONEMAPPING_ACES;
const env=window.createFieldEnvironment(B,scene,{addShadowCaster(){}},false);scene.meshes.find(m=>m.infiniteDistance)?.setEnabled(false);const flash=new B.StandardMaterial('flash',scene);flash.emissiveColor=new B.Color3(1,.8,.3);const rig=window.createFirstPersonRig(B,scene,camera,{...env.materials,flash},env);env.quality(true);
let weapon='carbine',ads=false,inspect=false,recoil=0,reload=0,clock=0;
function equip(kind){weapon=kind;rig.equip(kind);rig.gun.setEnabled(!['fists','knife','machete'].includes(kind));rig.hands.setEnabled(['fists','knife','machete'].includes(kind));rig.bladeView.setEnabled(kind==='knife'||kind==='machete');rig.rightArm.position.set(.205,0,0);rig.leftArm.position.set(-.205,0,0);rig.rightArm.rotation.set(0,-.13,0);rig.leftArm.rotation.set(0,.13,0);rig.leftArm.setEnabled(kind==='fists');rig.bladeSteel.scaling.z=rig.bladeEdge.scaling.z=kind==='machete'?1.5:1;}
for(const[k,label]of [['fists','전술 장갑'],['knife','전투도'],['machete','마체테'],['carbine','AR-4'],['smg','V-9'],['marksman','DMR-7']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>equip(k);document.getElementById('weapons').append(b)}equip(weapon);
document.getElementById('aim').onclick=()=>ads=!ads;document.getElementById('fire').onclick=()=>recoil=.1;document.getElementById('reload').onclick=()=>reload=1.9;document.getElementById('inspect').onclick=()=>inspect=!inspect;
engine.runRenderLoop(()=>{const dt=Math.min(.05,engine.getDeltaTime()/1000);clock+=dt;recoil=Math.max(0,recoil-dt*.55);reload=Math.max(0,reload-dt);camera.fov+=((ads?.7:1.08)-camera.fov)*Math.min(1,dt*12);rig.pose({dt,moving:false,step:0,time:clock,yaw:0,pitch:0,ads,recoil,reloading:reload,healing:0});if(inspect){rig.gun.position.set(.01,-.08,.86);rig.gun.rotation.set(-.1,-1.05,.1);rig.hands.position.set(0,-.07,.6);rig.rightArm.rotation.set(-.4,-.4,.2)}else{rig.hands.position.set(0,-.27,.58)}rig.muzzle.setEnabled(recoil>.07);scene.render();document.getElementById('stats').textContent=weapon+' · '+Math.round(engine.getFps())+' FPS'});addEventListener('resize',()=>engine.resize());
</script></html>
