<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b31"><title>LAST FIELD 실행 진단</title><style>html,body{margin:0;background:#142b31;color:#eef5f1;font:16px Arial,sans-serif}main{max-width:640px;margin:0 auto;padding:32px 22px}h1{font-size:26px;color:#efbf56}h2{font-size:19px;margin-top:30px}p{line-height:1.7;color:#bdd0cf}button,a{font:inherit;display:inline-block;background:#29434b;color:#fff;border:1px solid #8baba9;border-radius:6px;padding:12px 16px;margin:4px 4px 4px 0;text-decoration:none}li{padding:8px 0;overflow-wrap:anywhere;line-height:1.5}ul{padding-left:20px}.ok{color:#98e1b7}.bad{color:#ffbc9d}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d2128;padding:16px;line-height:1.7;font-size:13px}small{color:#bdd0cf}#graphic-result{padding:12px 0}</style></head><body><main><small>LAST FIELD · v3.1</small><h1>실행 진단</h1><p>이 페이지는 게임 엔진을 실행하지 않습니다. 아래 결과로 파일 연결 문제와 3D 실행 문제를 구분할 수 있습니다. 결과는 서버로 전송하지 않습니다.</p><h2>1. 파일 연결</h2><ul id="resources"><li>연결 확인 중…</li></ul><h2>2. 3D 기능</h2><button id="test-graphics">3D 기능 검사</button><div id="graphic-result" role="status">버튼을 누르면 작은 테스트 화면으로 3D 지원을 확인합니다.</div><h2>3. 브라우저 정보</h2><pre id="environment"></pre><p>문제가 계속되면 실패한 항목과 브라우저 정보를 알려 주세요.</p><a href="./?safe=1">가벼운 모드로 게임 열기</a><a href="./">게임으로 돌아가기</a><noscript><p class="bad">JavaScript 실행이 꺼져 있습니다. JavaScript를 허용해야 게임이 작동합니다.</p></noscript></main><script>
(function(){
var list=document.getElementById('resources');list.textContent='';
var files=['boot.js','online.js','shared/world.js','style.css','vendor/babylon.js','vendor/babylonjs.loaders.min.js','rules.js','controls.js','loot-visuals.js','game.js','environment.js','viewmodel.js','assets/environment/asphalt-color.jpg','assets/environment/daylight.hdr','assets/soldier.glb','assets/loot-atlas.png'];
files.forEach(function(file){var li=document.createElement('li');li.textContent=file+' · 확인 중';list.appendChild(li);var xhr=new XMLHttpRequest();xhr.open('HEAD',file+'?diagnostic=3.1',true);xhr.timeout=15000;xhr.onload=function(){var mime=xhr.getResponseHeader('content-type')||'';var ok=xhr.status>=200&&xhr.status<300&&mime.indexOf('text/html')<0;li.className=ok?'ok':'bad';li.textContent=file+' · '+(ok?'정상':'실패')+' (HTTP '+xhr.status+')';};xhr.onerror=xhr.ontimeout=function(){li.className='bad';li.textContent=file+' · 연결 실패 또는 시간 초과';};xhr.send();});
var storage='사용 가능';try{localStorage.setItem('last-field-diagnostic','1');localStorage.removeItem('last-field-diagnostic');}catch(e){storage='저장 제한 (게임은 실행 가능)';}
document.getElementById('environment').textContent=navigator.userAgent+'\n화면: '+innerWidth+' × '+innerHeight+' / 배율 '+(devicePixelRatio||1)+'\n터치: '+(navigator.maxTouchPoints||0)+'\n설정 저장: '+storage;
document.getElementById('test-graphics').onclick=function(){var result=document.getElementById('graphic-result');result.textContent='3D 기능 검사 중…';var canvas=document.createElement('canvas');canvas.width=canvas.height=16;var gl=null;try{gl=canvas.getContext('webgl2',{antialias:false});var name='WebGL 2';if(!gl){gl=canvas.getContext('webgl',{antialias:false});name='WebGL 1';}if(!gl)throw Error('3D 그래픽 연결을 만들지 못했습니다.');gl.clearColor(.1,.4,.2,1);gl.clear(gl.COLOR_BUFFER_BIT);var pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);if(gl.isContextLost()||gl.getError()!==gl.NO_ERROR||pixel[1]<80||pixel[1]>125)throw Error('3D 연결 또는 그리기 검사에 실패했습니다.');result.className='ok';result.textContent=name+' 그리기 정상 · 텍스처 최대 크기 '+gl.getParameter(gl.MAX_TEXTURE_SIZE)+'. 실제 게임의 메모리·성능까지 보장하는 검사는 아닙니다.';}catch(e){result.className='bad';result.textContent='3D 검사 실패: '+e.message;}finally{if(gl){var extension=gl.getExtension('WEBGL_lose_context');if(extension)extension.loseContext();}}};
})();
</script></body></html>
